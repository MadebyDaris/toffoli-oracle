# Sandbox env for the *old* tools. tweedledum 1.1.1 only ships wheels up to Python 3.10,
# and qiskit.circuit.classicalfunction only exists before Qiskit 2.0.
name: toffoli-sandbox
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      - tweedledum==1.1.1
      - qiskit>=1.3,<2
      - qiskit-aer
      - numpy
      - pytest
